<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Antibiotic Concentration Upload</title>
</head>
<body>
    <h1>Upload Antibiotic Concentration Data</h1>
    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv" required>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
